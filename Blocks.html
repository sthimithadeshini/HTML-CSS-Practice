<!DOCTYPE html>
<html>
  <head>
    <title>blocks type</title>
    <link rel="stylesheet" href="styles/Blocks exercises.css">
  </head>
  <body>
    <input class="name" type="text" placeholder="Name">

    <input class="email" type="text" placeholder="Email">

    <p class="thanks">
      Thanks for chatting with our customer support.
      Would you like to take our quick survey?
    </p>

    <input class="yes" type="text" placeholder="Yes">

    <input class="no" type="text" placeholder="No"><br>

    <input class="first" type="text" placeholder="First name">

    <input class="second" type="text" placeholder="Second name">

    <input class="email1" type="text" placeholder="Email">

    <button class="sign">
      Sign Up
    </button>

    <p class="request1">Request a ride now</p>

    <input class="enter1" type="text" 
    placeholder="Enter pickup distination">

    <input class="enter2" type="text" 
    placeholder="Enter distination">

    <button class="request2">Request now</button>
    <button class="schedule">Schedule for later</button>
  </body>
</html>
