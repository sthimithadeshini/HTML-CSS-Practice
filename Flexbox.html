<!DOCTYPE html>
<html>
  <head>
    <title>flexbox</title>
  </head>
  <body>
    <div style="
      display:flex;
      flex-direction:row;
      ">
      <div style="background-color:lightgrey;">Div1 text</div>
      <div style="background-color:lightgreen;">Div2<p>text</p></div>
    </div>

    <div style="
       margin-top:40px;
       display:flex;
       flex-direction:row;
      ">
      <div style="background-color:lightgrey;
         width:100px;
        ">
        100px</div>
      <div style="background-color:lightgreen;
         flex:1;
        ">
        flex 1</div>
    </div>


    <div style="
       margin-top:40px;
       display:flex;
       flex-direction:row;
      ">
      <div style="background-color:lightgrey;
         width:100px;
        ">
        100px
      </div>
      <div style="background-color:lightgreen;
         flex:1;
        ">
        flex 1
      </div>
      <div style="background-color:lightgrey;
         flex:2; 
        ">
         flex2
      </div>
    </div>

    <div style="
      display:flex;
      margin-top:40px;
      height:70px;
      border-width:1px;
      border-color:black;
      border-style:solid;
      justify-content:center;
      ">
      <div style="background-color:lightgrey;width:100px;">100px</div>
      <div style="background-color:lightgreen;width:100px;">100px</div>
      <div style="background-color:lightgrey;width:100px;">100px</div>
    </div>

    <div style="
      display:flex;
      margin-top:40px;
      height:70px;
      border-width:1px;
      border-color:black;
      border-style:solid;
      justify-content:space-between;
      ">
      <div style="background-color:lightgrey;width:100px;">100px</div>
      <div style="background-color:lightgreen;width:100px;">100px</div>
      <div style="background-color:lightgrey;width:100px;">100px</div>
    </div>

    <div style="
      display:flex;
      margin-top:40px;
      height:70px;
      border-width:1px;
      border-color:black;
      border-style:solid;
      justify-content:space-between;
      align-items:center;
      ">
      <div style="background-color:lightgrey;width:100px;">100px</div>
      <div style="background-color:lightgreen;width:100px;">100px</div>
      <div style="background-color:lightgrey;width:100px;">100px</div>
    </div>

    <div style="
      display:flex;
      margin-top:40px;
      height:70px;
      border-width:1px;
      border-color:black;
      border-style:solid;
      justify-content:space-between;
      align-items:center;
      ">
      <div style="background-color:lightgrey;flex:1;">100px</div>
      <div style="background-color:lightgreen;flex:1;">100px</div>
      <div style="background-color:lightgrey;flex:1;">100px</div>
    </div>
  </body>
</html>
