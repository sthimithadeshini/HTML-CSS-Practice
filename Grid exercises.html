<!DOCTYPE html>
<html>
  <head>
    <title>grid exercises</title>
  </head>
  <body>
    <div style="
      display:grid;
      grid-template-columns:200px 75px;
      ">
       <div style="background-color:lightpink;">200px</div>
       <div style="background-color:lightblue;">75px</div>
    </div>
    

    <div style="
      display:grid;
      grid-template-columns:50px 1fr 75px;
      margin-top:20px;
      ">
       <div style="background-color:lightpink;">
        col1</div>
       <div style="background-color:lightblue;">
        col2</div>
        <div style="background-color:lightpink;">
        col3</div>
    </div>


    <div style="
      display:grid;
      grid-template-columns:1fr 1fr 1fr 1fr ;
      margin-top:20px;
      column-gap:10px;
      row-gap:10px;
      ">
       <div style="background-color:lightpink;">
        col1</div>
       <div style="background-color:lightblue;">
        col2</div>
        <div style="background-color:lightpink;">
        col3</div>
        <div style="background-color:lightblue;">
        col2</div>
        <div style="background-color:lightpink;">
        col3</div>
        <div style="background-color:lightblue;">
        col2</div>
        <div style="background-color:lightpink;">
        col3</div>
        <div style="background-color:lightblue;">
        col2</div>
    </div>
  </body>
</html>
