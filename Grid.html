<!DOCTYPE html>
<head>
  <title>Grid</title>
</head>
<body>
  <div style="
    display:grid;
    grid-template-columns:100px 100px;
    "> 
    <div style="background-color:lightblue;">div1</div>
    <div style="background-color:lightpink;">div2 
      <p>text</p></div>
  </div>

  <div style="
    margin-top:40px;
    display:grid;
    grid-template-columns:100px 100px 200px 200px;
    "> 
    <div style="background-color:lightblue;">div1</div>
    <div style="background-color:lightpink;">div2</div>
    <div style="background-color:lightblue;">div3</div>
    <div style="background-color:lightpink;">div4</div>
  </div>

  <div style="
    margin-top:40px;
    display:grid;
    grid-template-columns:100px 100px 1fr;
    "> 
    <div style="background-color:lightblue;">div1</div>
    <div style="background-color:lightpink;">div2</div>
    <div style="background-color:lightblue;">div3</div>
  </div>
  
  <div style="
    margin-top:40px;
    display:grid;
    grid-template-columns:100px 1fr 1fr;
    "> 
    <div style="background-color:lightblue;">div1</div>
    <div style="background-color:lightpink;">div2</div>
    <div style="background-color:lightblue;">div3</div>
  </div>

  <div style="
    margin-top:40px;
    display:grid;
    grid-template-columns:100px 1fr 2fr;
    "> 
    <div style="background-color:lightblue;">div1</div>
    <div style="background-color:lightpink;">div2</div>
    <div style="background-color:lightblue;">div3</div>
  </div>
</body>
