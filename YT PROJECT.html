<!DOCTYPE html>
<html>
  <head>
    <title>youtube project</title>
    <style>
      .search{
        display:block;
      }
      .img1{
       width:300px;
      }
      .div1{
        display:inline-block;
        width:300px;
        vertical-align:top;
        margin-right:10px;
      }
      p{
        font-family:roboto,arial;
        margin-top:0;
        margin-bottom:0;
      }
      .channel-img{
        display:inline-block;
        width:50px;
        vertical-align:top;
      }
      .img2{
        width:40px;
        vertical-align:top;
        border-radius:20px;
        margin-top:10px;
      }
      .info{
        display:inline-block;
        width:200px;
        vertical-align:top;
      }
      .p1{
        width:250px;
        font-size:15px;
        font-weight:600;
        margin-top:10px;
        margin-bottom:10px;
      }
      .p2{
        font-size:12px;
        color:rgba(96,96,96);
        margin-bottom:5px;
      }
      .p3{
        font-size:12px;
        color:rgba(96,96,96);
      }
      
      .div3{
        display:inline-block;
        width:250px;
        vertical-align:top;
      }
      .img3{
        width:250px;
      }
      .div2{
        display:grid;
        grid-template-columns:50px 1fr;
      }
    </style>
  </head>
  <body>
    <input class="search" type="text" placeholder="search">
    
    <div class="div1">
      <div> 
        <img class="img1" src="thumbnails/thumbnail-1.webp">
      </div>

      <div class="div2">
        <div class="channel-img"> 
          <img  class="img2" src="channelpictures/channel-1.jpeg">
        </div>

        <div class="info"> 
         <p class="p1">
           Talking Tech and AI with Google CEO Sundar Pichai!
         </p>
         <p class="p2">
           Marques Brownlee
         </p>
         <p class="p3">
           3.4M views&middot;6 months ago
         </p>
        </div>
      </div>
    </div>



     
    <div class="div1">
      <div> 
        <img class="img1" src="thumbnails/thumbnail-2.webp">
      </div>

      <div class="div2">
        <div class="channel-img"> 
          <img  class="img2" src="channelpictures/channel-2.jpeg">
        </div>

        <div class="info"> 
         <p class="p1">
            Try Not To Laugh Chanllenge &#35;9
         </p>
         <p class="p2">
          Markipiler
         </p>
         <p class="p3">
         19M views &middot; 4years ago
         </p>
        </div>
      </div>
    </div>
     
  </body>
</html>
