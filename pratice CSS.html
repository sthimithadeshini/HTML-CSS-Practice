<STYLE>
  .sthim-button{
    background-color:pink;
    color:black;
    border:none;
    height:50px;
    width:150px;
    font-size:20px;
    border-radius:10px;
    transition:background-color 0.15s,box-shadow 0.15s;
    cursor:pointer;
  }
  .sthim-button:hover{
    background-color:violet;
    box-shadow:2px 10px 10px rgba(0,0,0,0.20);
  }
  .sthim-button:active{
    background-color:brown;
    color:white;
  }

</STYLE>
<button class="sthim-button"><b>STHIMITHA</b></button>
